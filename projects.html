<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="codefx-mode" content="static">
  <meta name="description" content="Programmer, designer, photographer & gardener">
  <meta property="og:title" content="Mithun Hasan">
  <meta property="og:description" content="Programmer, designer, photographer & gardener">
  <meta property="og:image" content="">
  <meta property="og:url" content="https://eMithun.github.io/projects">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Mithun Hasan">
  <meta name="twitter:description" content="Programmer, designer, photographer & gardener">
  <meta name="twitter:image" content="">
  <title>Projects - Mithun Hasan</title>
  <link rel="stylesheet" href="/assets/css/reset.css">
  <link rel="stylesheet" href="/assets/css/variables.css">
  <link rel="stylesheet" href="/assets/css/utilities.css">
  <link rel="stylesheet" href="/assets/css/auth.css">
  <link rel="stylesheet" href="/assets/css/sso.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    .nav-link { position: relative; font-weight: 500; font-size: 0.9rem; padding: 0.5rem 0; color: var(--color-text-secondary); transition: color 0.2s; }
    .nav-link::after { content: ''; position: absolute; bottom: 0; left: 0; width: 0; height: 2px; background: var(--color-primary); transition: width 0.2s; border-radius: 1px; }
    .nav-link:hover, .nav-link.active { color: var(--color-primary); }
    .nav-link:hover::after, .nav-link.active::after { width: 100%; }
    .header-blur { backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); background: rgba(255,255,255,0.8); }
    [data-theme="dark"] .header-blur { background: rgba(11, 17, 33, 0.85); }
    .mobile-menu-btn { display: none; flex-direction: column; gap: 5px; cursor: pointer; background: none; border: none; padding: 4px; }
    .project-meta { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--color-border); }
    .meta-item { display: flex; align-items: center; gap: 0.375rem; font-size: 0.8rem; color: var(--color-text-secondary); }
    .status-live { background: var(--color-success); color: white; }
    .status-maintenance { background: var(--color-warning); color: white; }
    .status-offline { background: var(--color-error); color: white; }
    @media (max-width: 768px) {
      .mobile-menu-btn { display: flex; }
      .nav-links { display: none; position: absolute; top: 100%; left: 0; right: 0; background: var(--color-background); border-bottom: 1px solid var(--color-border); padding: 1rem; flex-direction: column; gap: 0.5rem; box-shadow: var(--shadow-lg); }
      .nav-links.open { display: flex; }
      .nav-link { padding: 0.75rem 1rem; }
    }
  </style>
</head>
<body>
  <header class="header-blur" style="height:var(--header-height);position:sticky;top:0;z-index:var(--z-sticky);border-bottom:1px solid var(--color-border)">
    <div class="container flex items-center justify-between" style="height:100%">
      <a href="/" style="font-weight:800;font-size:1.15rem;letter-spacing:-0.02em;color:var(--color-text)">Mithun Hasan</a>
      <button class="mobile-menu-btn" id="mobile-menu-toggle" aria-label="Menu"><span></span><span></span><span></span></button>
      <nav class="flex items-center gap-lg nav-links" id="main-nav">
        <a href="/" class="nav-link">Home</a>
        <a href="/about" class="nav-link">About</a>
        <a href="/projects" class="nav-link active">Projects</a>
        <a href="/contact" class="nav-link">Contact</a>
        <a href="/blog" class="nav-link">Blog</a>
        <a href="/legal" class="nav-link">Legal</a>
        <a href="/gallery" class="nav-link">Gallery</a>
        <div id="auth-state"></div>
        <button id="theme-toggle" class="btn-ghost" style="width:36px;height:36px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-lg);border:1px solid var(--color-border);cursor:pointer;background:transparent" aria-label="Toggle theme">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
        </button>
      </nav>
    </div>
  </header>

  <main>
    <section class="section section-alt">
      <div class="container">
        <div class="animate-in">
          <h2 class="section-title">My Projects</h2>
          <p class="section-subtitle">Explore my work across GitHub organizations</p>
        </div>
        <div class="grid stagger-children" id="projects-grid" style="grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1.5rem">
          <!-- Projects will be loaded here -->
        </div>
      </div>
    </section>
  </main>

  <footer style="border-top:1px solid var(--color-border);padding:3rem 0;text-align:center">
    <div class="container">
      <p style="color:var(--color-text-muted);font-size:0.875rem">&copy; 2026 Mithun Hasan. <a href="/projects" style="color:var(--color-primary)">eMithun Portfolio</a></p>
    </div>
  </footer>

  <script id="codefx-config" type="application/json">{"sections":["about","skills","experience","projects","contact"],"name":"Mithun Hasan","description":"Programmer since 2008 · Designer since 2010 · Photographer since 2015 · Gardener for life","about":"Programmer since 2008. Professional graphic designer since 2010. Web developer since 2012. Professional photographer since 2015. Gardening is my lifelong passion.","skills":[{"title":"Programming","desc":"C, C++, Python"},{"title":"Web Dev","desc":"React, Node, Django, PHP, Laravel, WordPress"},{"title":"Design","desc":"Logo, Banner, Mockup"},{"title":"Photography","desc":"Portrait, Landscape, Macro"},{"title":"Gardening","desc":"Bonsai, Cloning, Landscaping"}],"projects":[{"title":"CodeFX","desc":"Modular multi-platform web framework"},{"title":"Photography Portfolio","desc":"Professional photography showcase"},{"title":"Garden Shop","desc":"Plant shop with fertilizer & tools"}]}</script>
  <script src="/assets/js/core.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/sso.js"></script>
  <script>
    // Default projects (fallback)
    const defaultProjects = [
      { id: 1, name: 'CodeFX', description: 'Modular multi-platform web framework', tags: ['Web', 'Framework'], status: 'live', version: 'v1.0.0', githubUrl: 'https://github.com/eMithun/CodeFX', trackingUrl: '', devices: ['Desktop', 'Mobile'] },
      { id: 2, name: 'Photography Portfolio', description: 'Professional photography showcase', tags: ['Photography', 'Portfolio'], status: 'maintenance', version: 'v2.1.0', githubUrl: '', trackingUrl: '', devices: ['Desktop', 'Mobile', 'Tablet'] },
      { id: 3, name: 'Garden Shop', description: 'Plant shop with fertilizer & tools', tags: ['E-Commerce', 'Plants'], status: 'offline', version: 'v0.5.0', githubUrl: '', trackingUrl: '', devices: ['Desktop'] }
    ]

    function getProjects() {
      try {
        return JSON.parse(localStorage.getItem('codefx_projects') || 'null') || defaultProjects
      } catch {
        return defaultProjects
      }
    }

    function renderProjects() {
      const grid = document.getElementById('projects-grid')
      const projects = getProjects()

      grid.innerHTML = projects.map(project => `
        <div class="project-card animate-in" style="background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-xl); padding: 1.75rem; transition: all 0.3s ease; position: relative; overflow: hidden;">
          <div class="project-icon" style="width:48px;height:48px;border-radius:var(--radius-lg);background:var(--color-gradient-1);display:flex;align-items:center;justify-content:center;color:white;font-size:1.25rem;font-weight:700;margin-bottom:1rem">
            ${project.name.charAt(0).toUpperCase()}
          </div>
          <div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.5rem">
            <h3 style="font-size:1.1rem;font-weight:700;margin:0">${project.name}</h3>
            <span class="badge status-${project.status}" style="font-size:0.65rem;padding:0.15rem 0.5rem">${project.status.charAt(0).toUpperCase() + project.status.slice(1)}</span>
          </div>
          <p style="color:var(--color-text-secondary);font-size:0.9rem;margin-bottom:1rem">${project.description}</p>
          <div style="display:flex;gap:0.375rem;flex-wrap:wrap;margin-bottom:1rem">
            ${project.tags.map(tag => `<span style="padding:0.2rem 0.6rem;border-radius:var(--radius-md);font-size:0.75rem;background:var(--color-surface);border:1px solid var(--color-border);color:var(--color-text-muted)">${tag}</span>`).join('')}
          </div>
          <div class="project-meta">
            <div class="meta-item">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3 7h7l-5.5 4 2 7-6.5-4.5L5.5 21l2-7L2 9h7l3-7z"/></svg>
              <span>Version: ${project.version}</span>
            </div>
            <div class="meta-item">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/></svg>
              <span>Devices: ${project.devices.join(', ')}</span>
            </div>
            ${project.githubUrl ? `
            <div class="meta-item">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 00-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0020 4.77 5.07 5.07 0 0019.91 1S18.73.65 16 2.48a13.38 13.38 0 00-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 005 4.77a5.44 5.44 0 00-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 009 18.13V22"/></svg>
              <a href="${project.githubUrl}" target="_blank" style="color:var(--color-primary);text-decoration:none">GitHub</a>
            </div>
            ` : ''}
            ${project.trackingUrl ? `
            <div class="meta-item">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <a href="${project.trackingUrl}" target="_blank" style="color:var(--color-primary);text-decoration:none">Status</a>
            </div>
            ` : ''}
          </div>
        </div>
      `).join('')

      // Add animations
      setTimeout(() => {
        document.querySelectorAll('.animate-in').forEach(el => el.classList.add('visible'))
      }, 100)
    }

    document.addEventListener('DOMContentLoaded', renderProjects)
  </script>
</body>
</html>
