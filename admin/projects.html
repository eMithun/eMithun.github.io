<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects — CodeFX Admin</title>
  <link rel="stylesheet" href="/assets/css/reset.css">
  <link rel="stylesheet" href="/assets/css/variables.css">
  <link rel="stylesheet" href="/assets/css/utilities.css">
  <link rel="stylesheet" href="/assets/css/dashboard.css">
  <style>
    .admin-layout { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
    .admin-sidebar { background: var(--color-surface); border-right: 1px solid var(--color-border); padding: 1.5rem; position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; }
    .admin-sidebar h2 { font-weight: 700; margin-bottom: 1.5rem; font-size: 1.1rem; }
    .admin-sidebar nav { display: grid; gap: 0.25rem; flex: 1; }
    .admin-sidebar a { padding: 0.5rem 0.75rem; border-radius: var(--radius-md); font-size: 0.9rem; display: flex; align-items: center; gap: 0.5rem; }
    .admin-sidebar a:hover { background: var(--color-border); }
    .admin-sidebar a.active { background: var(--color-primary); color: white; }
    .admin-sidebar a.active svg { stroke: white; }
    .admin-sidebar .badge { margin-left: auto; font-size: 0.7rem; padding: 0.125rem 0.5rem; border-radius: 999px; background: var(--color-primary); color: white; }
    .admin-sidebar svg { flex-shrink: 0; }
    .admin-sidebar-footer { margin-top: auto; padding-top: 1rem; border-top: 1px solid var(--color-border); }
    .admin-topbar { display: flex; align-items: center; justify-content: space-between; padding: 0.75rem 2rem; border-bottom: 1px solid var(--color-border); background: var(--color-surface); }
    .admin-topbar-user { display: flex; align-items: center; gap: 0.75rem; font-size: 0.875rem; }
    .admin-topbar-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--color-primary); color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.8rem; }
    .admin-content { padding: 2rem; max-width: 72rem; }
    .admin-header { margin-bottom: 2rem; }
    .admin-header h1 { font-size: 1.5rem; font-weight: 700; }
    .admin-header p { color: var(--color-text-muted); font-size: 0.875rem; }
    .project-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem; }
    .project-card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: 1.5rem; position: relative; }
    .project-icon { width: 48px; height: 48px; border-radius: var(--radius-md); background: var(--color-gradient-1); display: flex; align-items: center; justify-content: center; color: white; font-size: 1.25rem; font-weight: 700; margin-bottom: 1rem; }
    .project-status-badge { position: absolute; top: 1rem; right: 1rem; padding: 0.25rem 0.75rem; border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
    .status-live { background: var(--color-success); color: white; }
    .status-maintenance { background: var(--color-warning); color: white; }
    .status-offline { background: var(--color-error); color: white; }
    .project-actions { display: flex; gap: 0.5rem; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--color-border); }
    .btn-sm { padding: 0.375rem 0.75rem; font-size: 0.8rem; }
    .btn-danger { background: var(--color-error); color: white; }
    .add-project-btn { display: block; width: 100%; padding: 2rem; text-align: center; border: 2px dashed var(--color-border); border-radius: var(--radius-lg); cursor: pointer; color: var(--color-text-muted); }
    .add-project-btn:hover { border-color: var(--color-primary); color: var(--color-primary); }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 1000; }
    .modal-overlay.active { display: flex; }
    .modal { background: var(--color-background); border-radius: var(--radius-lg); padding: 2rem; width: 90%; max-width: 600px; max-height: 90vh; overflow-y: auto; }
    .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; }
    .modal-header h2 { font-size: 1.25rem; font-weight: 700; }
    .close-btn { background: none; border: none; cursor: pointer; padding: 0.5rem; }
    .form-group { margin-bottom: 1.25rem; }
    .form-label { display: block; font-weight: 500; margin-bottom: 0.5rem; font-size: 0.9rem; }
    .form-input, .form-textarea, .form-select { width: 100%; padding: 0.75rem 1rem; border: 1px solid var(--color-border); border-radius: var(--radius-md); font-size: 0.9rem; background: var(--color-surface); }
    .form-textarea { min-height: 100px; resize: vertical; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .tags-input { display: flex; flex-wrap: wrap; gap: 0.5rem; padding: 0.5rem; border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-surface); }
    .tag { display: flex; align-items: center; gap: 0.5rem; padding: 0.25rem 0.75rem; background: var(--color-border); border-radius: 999px; font-size: 0.8rem; }
    .tag-remove { background: none; border: none; cursor: pointer; padding: 0; font-size: 1rem; }
    .devices-list { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .device-option { display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 1rem; border: 1px solid var(--color-border); border-radius: var(--radius-md); cursor: pointer; }
    .device-option.selected { background: var(--color-primary); color: white; border-color: var(--color-primary); }
  </style>
<script src="/assets/js/admin-auth.js"></script>
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <h2>CodeFX</h2>
      <nav>
        <a href="/admin/index.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg> Dashboard</a>
        <a href="/admin/projects.html" class="active"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3 7h7l-5.5 4 2 7-6.5-4.5L5.5 21l2-7L2 9h7l3-7z"/></svg> Projects</a>
        <a href="/admin/database"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg> Database</a>
        <a href="/admin/plugins/index.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> Plugins</a>
        <a href="/admin/tools/index.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg> Tools</a>
        <a href="/admin/files/index.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg> Files</a>
        <a href="/admin/status/index.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg> Status</a>
        <a href="/admin/social/index.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg> Social</a>
        <a href="/blog/admin.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg> Blog</a>
        <a href="/gallery/admin.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg> Gallery</a>
      </nav>
      <div class="admin-sidebar-footer">
        <a href="#" onclick="openSettings()" title="Settings" style="cursor:pointer">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          Settings
        </a>
      </div>
    </aside>
    <div class="admin-main" style="display:flex;flex-direction:column;flex:1;min-height:100vh">
      <div class="admin-topbar">
        <div class="admin-topbar-user">
          <div class="admin-topbar-avatar" id="topbar-avatar">A</div>
          <span id="topbar-email">admin</span>
        </div>
        <a href="/" target="_blank" class="btn btn-outline" style="padding:0.375rem 0.75rem;font-size:0.8rem">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:0.375rem"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          View Website
        </a>
      </div>
      <main class="admin-content">
        <div class="admin-header">
          <h1>Manage Projects</h1>
          <p>Add, edit, and organize your portfolio projects</p>
        </div>
        <div class="project-grid" id="projects-grid">
          <!-- Projects will be loaded here -->
        </div>
      </main>
    </div>
  </div>

  <!-- Add/Edit Modal -->
  <div class="modal-overlay" id="project-modal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-title">Add Project</h2>
        <button class="close-btn" onclick="closeModal()">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <form id="project-form">
        <input type="hidden" id="project-id">
        <div class="form-group">
          <label class="form-label">Project Name</label>
          <input type="text" id="project-name" class="form-input" required>
        </div>
        <div class="form-group">
          <label class="form-label">Description</label>
          <textarea id="project-description" class="form-textarea" required></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Status</label>
            <select id="project-status" class="form-select" required>
              <option value="live">Live</option>
              <option value="maintenance">Maintenance</option>
              <option value="offline">Offline</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Version</label>
            <input type="text" id="project-version" class="form-input" placeholder="v1.0.0">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">GitHub URL</label>
            <input type="url" id="project-github" class="form-input" placeholder="https://github.com/...">
          </div>
          <div class="form-group">
            <label class="form-label">Status Tracking URL</label>
            <input type="url" id="project-tracking" class="form-input" placeholder="https://status.example.com/...">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Tags</label>
          <div class="tags-input" id="tags-container">
            <input type="text" id="tag-input" placeholder="Type tag and press Enter" class="form-input" style="flex:1;min-width:150px;border:none;background:transparent;padding:0.5rem;">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Supported Devices</label>
          <div class="devices-list" id="devices-container">
            <div class="device-option" data-device="Desktop" onclick="toggleDevice(this)">Desktop</div>
            <div class="device-option" data-device="Mobile" onclick="toggleDevice(this)">Mobile</div>
            <div class="device-option" data-device="Tablet" onclick="toggleDevice(this)">Tablet</div>
            <div class="device-option" data-device="IoT" onclick="toggleDevice(this)">IoT</div>
          </div>
        </div>
        <div style="display:flex;gap:0.75rem;justify-content:flex-end;margin-top:2rem">
          <button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Project</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/assets/js/core.js"></script>
  <script>
    (function() {
      var raw = localStorage.getItem('codefx_session')
      if (raw) {
        try {
          var s = JSON.parse(raw)
          var avatar = document.getElementById('topbar-avatar')
          var email = document.getElementById('topbar-email')
          if (avatar) avatar.textContent = (s.email || 'A')[0].toUpperCase()
          if (email) email.textContent = s.email || 'admin'
        } catch {}
      }
    })()

    let currentTags = []
    let currentDevices = []
    let editingProjectId = null

    // Default projects
    const defaultProjects = [
      { id: Date.now(), name: 'CodeFX', description: 'Modular multi-platform web framework', tags: ['Web', 'Framework'], status: 'live', version: 'v1.0.0', githubUrl: 'https://github.com/eMithun/CodeFX', trackingUrl: '', devices: ['Desktop', 'Mobile'] },
      { id: Date.now() + 1, name: 'Photography Portfolio', description: 'Professional photography showcase', tags: ['Photography', 'Portfolio'], status: 'maintenance', version: 'v2.1.0', githubUrl: '', trackingUrl: '', devices: ['Desktop', 'Mobile', 'Tablet'] },
      { id: Date.now() + 2, name: 'Garden Shop', description: 'Plant shop with fertilizer & tools', tags: ['E-Commerce', 'Plants'], status: 'offline', version: 'v0.5.0', githubUrl: '', trackingUrl: '', devices: ['Desktop'] }
    ]

    function getProjects() {
      try {
        return JSON.parse(localStorage.getItem('codefx_projects') || 'null') || defaultProjects
      } catch {
        return defaultProjects
      }
    }

    function saveProjects(projects) {
      localStorage.setItem('codefx_projects', JSON.stringify(projects))
    }

    function renderProjects() {
      const grid = document.getElementById('projects-grid')
      const projects = getProjects()

      grid.innerHTML = projects.map(project => `
        <div class="project-card animate-in">
          <div class="project-status-badge status-${project.status}">${project.status.charAt(0).toUpperCase() + project.status.slice(1)}</div>
          <div class="project-icon">${project.name.charAt(0).toUpperCase()}</div>
          <h3 style="font-size:1.1rem;font-weight:700;margin-bottom:0.5rem">${project.name}</h3>
          <p style="color:var(--color-text-secondary);font-size:0.9rem;margin-bottom:1rem">${project.description}</p>
          <div style="display:flex;gap:0.375rem;flex-wrap:wrap;margin-bottom:1rem">
            ${project.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
          </div>
          <div style="color:var(--color-text-muted);font-size:0.8rem;margin-bottom:0.5rem">Version: ${project.version}</div>
          <div style="color:var(--color-text-muted);font-size:0.8rem;margin-bottom:1rem">Devices: ${project.devices.join(', ')}</div>
          <div class="project-actions">
            <button class="btn btn-outline btn-sm" onclick="editProject(${project.id})">Edit</button>
            <button class="btn btn-danger btn-sm" onclick="deleteProject(${project.id})">Delete</button>
          </div>
        </div>
      `).join('')

      // Add the "Add Project" button
      const addBtn = document.createElement('div')
      addBtn.className = 'add-project-btn'
      addBtn.onclick = () => openModal()
      addBtn.innerHTML = `
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin:0 auto 1rem">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        <div style="font-weight:600">Add New Project</div>
      `
      grid.appendChild(addBtn)
    }

    function openModal(projectId = null) {
      editingProjectId = projectId
      const modal = document.getElementById('project-modal')
      const title = document.getElementById('modal-title')

      if (projectId) {
        title.textContent = 'Edit Project'
        const projects = getProjects()
        const project = projects.find(p => p.id === projectId)
        if (project) {
          document.getElementById('project-id').value = project.id
          document.getElementById('project-name').value = project.name
          document.getElementById('project-description').value = project.description
          document.getElementById('project-status').value = project.status
          document.getElementById('project-version').value = project.version
          document.getElementById('project-github').value = project.githubUrl || ''
          document.getElementById('project-tracking').value = project.trackingUrl || ''
          currentTags = [...(project.tags || [])]
          currentDevices = [...(project.devices || [])]
          renderTags()
          renderDevices()
        }
      } else {
        title.textContent = 'Add Project'
        document.getElementById('project-form').reset()
        currentTags = []
        currentDevices = ['Desktop']
        renderTags()
        renderDevices()
      }

      modal.classList.add('active')
    }

    function closeModal() {
      document.getElementById('project-modal').classList.remove('active')
      editingProjectId = null
    }

    function renderTags() {
      const container = document.getElementById('tags-container')
      const tagInput = document.getElementById('tag-input')
      container.innerHTML = currentTags.map(tag => `
        <div class="tag">
          ${tag}
          <button type="button" class="tag-remove" onclick="removeTag('${tag}')">&times;</button>
        </div>
      `).join('')
      container.appendChild(tagInput)
    }

    function addTag(tag) {
      if (tag && !currentTags.includes(tag)) {
        currentTags.push(tag)
        renderTags()
      }
    }

    function removeTag(tag) {
      currentTags = currentTags.filter(t => t !== tag)
      renderTags()
    }

    function renderDevices() {
      const container = document.getElementById('devices-container')
      container.querySelectorAll('.device-option').forEach(option => {
        if (currentDevices.includes(option.dataset.device)) {
          option.classList.add('selected')
        } else {
          option.classList.remove('selected')
        }
      })
    }

    function toggleDevice(el) {
      const device = el.dataset.device
      if (currentDevices.includes(device)) {
        currentDevices = currentDevices.filter(d => d !== device)
      } else {
        currentDevices.push(device)
      }
      renderDevices()
    }

    document.getElementById('tag-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault()
        addTag(e.target.value.trim())
        e.target.value = ''
      }
    })

    document.getElementById('project-form').addEventListener('submit', (e) => {
      e.preventDefault()

      const project = {
        id: editingProjectId || Date.now(),
        name: document.getElementById('project-name').value,
        description: document.getElementById('project-description').value,
        status: document.getElementById('project-status').value,
        version: document.getElementById('project-version').value,
        githubUrl: document.getElementById('project-github').value,
        trackingUrl: document.getElementById('project-tracking').value,
        tags: currentTags,
        devices: currentDevices
      }

      const projects = getProjects()
      if (editingProjectId) {
        const idx = projects.findIndex(p => p.id === editingProjectId)
        if (idx !== -1) projects[idx] = project
      } else {
        projects.push(project)
      }
      saveProjects(projects)
      renderProjects()
      closeModal()
      alert('Project saved!')
    })

    function editProject(id) {
      openModal(id)
    }

    function deleteProject(id) {
      if (confirm('Are you sure you want to delete this project?')) {
        let projects = getProjects()
        projects = projects.filter(p => p.id !== id)
        saveProjects(projects)
        renderProjects()
      }
    }

    function openSettings() {
      window.toggleAccountPanel && window.toggleAccountPanel()
    }

    // Initialize
    renderProjects()
  </script>
</body>
</html>
